{% extends 'base.html' %}

{% block title %} Comparación de precios {% endblock %}

{% block content %}
<div class="search-area">
    <h1>Obtener precios de un juego</h1>
    <form id="game-form" class="search-form" action="/juego" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="sr-only" for="game">Nombre del juego</label>
        <input type="text" name="game-link" id="game" placeholder="Nombre del juego" autocomplete="off" required>
        <button type="submit" id="search-submit" aria-label="Buscar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
            </svg>
            <span class="sr-only">Buscar</span>
        </button>
    </form>
</div>

<section id="results-panel" class="results-panel" role="dialog" aria-modal="true" aria-labelledby="results-title" aria-hidden="true">
    <div class="panel-header">
        <h2 id="results-title">Resultados de la búsqueda</h2>
        <button type="button" id="panel-close" aria-label="Cerrar panel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
    </div>
    <div class="panel-body">
        <section class="store-section" data-store="steam">
            <span class="store-badge badge-steam">Steam</span>
            <div class="store-view"></div>
        </section>
        <section class="store-section" data-store="gog">
            <span class="store-badge badge-gog">GOG</span>
            <div class="store-view"></div>
        </section>
        <section class="store-section" data-store="egs">
            <span class="store-badge badge-egs">Epic Games</span>
            <div class="store-view"></div>
        </section>
    </div>
</section>
<div id="panel-backdrop" class="panel-backdrop"></div>

<template id="game-panel-template">
    <article class="store-card">
        <img class="cover-img" src="{{ url_for('static', filename='img/placeholder.svg') }}" data-placeholder="{{ url_for('static', filename='img/placeholder.svg') }}" alt="">
        <div class="store-card-body">
            <h3 class="card-title"></h3>
            <p class="card-desc"></p>
            <div class="price-card">
                <span class="price-original"></span>
                <span class="price-chip"></span>
                <span class="price-final"></span>
            </div>
            <a class="card-link" href="#" target="_blank" rel="noopener">
                <span>Ir a la tienda</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </a>
        </div>
    </article>
</template>

<noscript>
    <p>Habilita JavaScript para comparar precios automáticamente. Al enviar el formulario se mostrará la respuesta del servidor.</p>
</noscript>
{% endblock %}
