[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamescraper"
version = "0.1.0"
description = "Scrapes game prices from Steam, GOG, and Epic Games and compares them in a Flask app."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies intentionally stay in requirements.txt (Tier 4 splits
# production vs development); the editable install only registers packages.
dependencies = []

[tool.setuptools]
# Flat layout, explicit packages (zero directory moves).
packages = ["src", "src.routes", "steamScrape", "steamScrape.spiders"]

[tool.setuptools.package-data]
src = ["static/*", "static/**/*", "templates/*", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]