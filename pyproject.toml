[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamescraper"
version = "0.1.0"
description = "Scrapes game prices from Steam, GOG, and Epic Games and compares them in a Flask app."
readme = "README.md"
requires-python = ">=3.11"
# Production runtime dependencies (REQ-PKG-4). Pinned; do not unpin.
dependencies = [
    "Flask==3.1.0",
    "flask-wtf==1.3.0",
    "Scrapy==2.12.0",
    "crochet==2.1.1",
    "Twisted==24.11.0",
    "waitress==3.0.2",
    "nh3==0.3.7",
    "beautifulsoup4==4.13.4",
    "lxml==5.4.0",
    "roman==5.0",
    "cryptography==44.0.3",
    "pyOpenSSL==25.0.0",
    "service-identity==24.2.0",
    "python-dotenv==1.0.1",
]

# Development tooling (formerly requirements-dev.txt). Installed by `uv sync`;
# production-only installs use `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "ipython==9.2.0",
]

[tool.setuptools]
# Flat layout, explicit packages (zero directory moves).
packages = ["src", "src.routes", "steamScrape", "steamScrape.spiders"]

[tool.setuptools.package-data]
src = ["static/*", "static/**/*", "templates/*", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]