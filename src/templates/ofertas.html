{% extends 'base.html' %}

{% block title %} Ofertas {% endblock %}

{% block content %}
<h1>Ofertas de hoy</h1>
<div class="offers-shell">
    <section class="store-section" data-store="steam">
        <div class="store-head">
            <span class="store-badge badge-steam">Steam</span>
            <h2>Ofertas de Steam</h2>
        </div>
        <div class="offer-grid"></div>
        <a class="view-more" href="https://store.steampowered.com/search/?category1=998&amp;os=win&amp;specials=1&amp;ndl=1" target="_blank" rel="noopener">Ver más en Steam</a>
    </section>

    <section class="store-section" data-store="egs">
        <div class="store-head">
            <span class="store-badge badge-egs">Epic Games</span>
            <h2>Ofertas de Epic Games</h2>
        </div>
        <div class="offer-grid"></div>
        <a class="view-more" href="https://store.epicgames.com/es-ES/browse?sortBy=releaseDate&amp;sortDir=DESC&amp;tag=Superoferta%20de%20Epic&amp;category=Game&amp;count=40&amp;start=0" target="_blank" rel="noopener">Ver más en Epic Games</a>
    </section>

    <section class="store-section" data-store="gog">
        <div class="store-head">
            <span class="store-badge badge-gog">GOG</span>
            <h2>Ofertas de GOG</h2>
        </div>
        <div class="offer-grid"></div>
        <a class="view-more" href="https://www.gog.com/en/games?discounted=true" target="_blank" rel="noopener">Ver más en GOG</a>
    </section>
</div>

<template id="offer-card-template">
    <article class="offer-card">
        <img class="cover-img" src="{{ url_for('static', filename='img/placeholder.svg') }}" data-placeholder="{{ url_for('static', filename='img/placeholder.svg') }}" alt="">
        <div class="offer-card-body">
            <h3 class="card-title"></h3>
            <div class="price-card">
                <span class="price-original"></span>
                <span class="price-chip"></span>
                <span class="price-final"></span>
            </div>
            <a class="card-link" href="#" target="_blank" rel="noopener">
                <span>Ver oferta</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </a>
        </div>
    </article>
</template>

<noscript>
    <p>Habilita JavaScript para cargar las ofertas de hoy automáticamente.</p>
</noscript>
{% endblock %}
